<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" fill="none">
  <defs>
    <!-- Luxurious Obsidian & Deep Violet Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#090514;stop-opacity:1" />
      <stop offset="45%" style="stop-color:#150a2b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#070210;stop-opacity:1" />
    </linearGradient>

    <!-- Electric Sunrise Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff3366;stop-opacity:1" />
      <stop offset="35%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e11d48;stop-opacity:1" />
    </linearGradient>

    <!-- Badge Card Gradients -->
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff3366;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#ff3366;stop-opacity:0.03" />
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:0.03" />
    </linearGradient>
    <linearGradient id="card3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0.03" />
    </linearGradient>
    <linearGradient id="card4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.03" />
    </linearGradient>

    <!-- Glow Orbs -->
    <filter id="glowCrimson" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
  </defs>

  <!-- Base Rectangle -->
  <rect width="1200" height="450" fill="url(#bgGrad)" rx="24" stroke="#2e1065" stroke-width="2" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="200" cy="140" r="180" fill="#ff3366" opacity="0.22" filter="url(#glowCrimson)" />
  <circle cx="1000" cy="310" r="200" fill="#a855f7" opacity="0.22" filter="url(#glowCrimson)" />
  <circle cx="600" cy="220" r="160" fill="#ff6b35" opacity="0.15" filter="url(#glowGold)" />

  <!-- Futuristic Geometric Grid Grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="75" x2="1200" y2="75" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="225" x2="1200" y2="225" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="375" x2="1200" y2="375" />
    <line x1="150" y1="0" x2="150" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="450" y1="0" x2="450" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="750" y1="0" x2="750" y2="450" />
    <line x1="900" y1="0" x2="900" y2="450" />
    <line x1="1050" y1="0" x2="1050" y2="450" />
  </g>

  <!-- Top Center Pill Badge -->
  <g transform="translate(425, 38)">
    <rect width="350" height="34" rx="17" fill="#1e1b4b" stroke="#ff3366" stroke-width="1.5" />
    <circle cx="22" cy="17" r="6" fill="#ff3366" />
    <text x="40" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#ff6b35" letter-spacing="2">CLAUDE CODE CLI EXTENSION</text>
  </g>

  <!-- Author Badge Top Right -->
  <g transform="translate(970, 32)">
    <rect width="200" height="32" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="100" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e5e7eb" text-anchor="middle">
      Created by <tspan fill="#ff3366" font-weight="800">Anvaya Arsha</tspan>
    </text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="62" font-weight="900" fill="url(#titleGrad)" text-anchor="middle" letter-spacing="-1">
    AI SALES TEAM
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#cbd5e1" text-anchor="middle" letter-spacing="0.5">
    Autonomous Outbound Sales Intelligence &amp; BANT + MEDDIC Lead Scoring
  </text>

  <!-- Glowing Bar Divider -->
  <rect x="350" y="208" width="500" height="3.5" rx="2" fill="url(#titleGrad)" />

  <!-- 4 Feature Cards Grid -->
  <!-- Card 1 -->
  <g transform="translate(50, 245)">
    <rect width="250" height="155" rx="16" fill="url(#card1)" stroke="#ff3366" stroke-opacity="0.5" stroke-width="1.5" />
    <circle cx="38" cy="42" r="18" fill="#4c0519" stroke="#ff3366" stroke-width="1.5" />
    <text x="38" y="48" font-family="system-ui, sans-serif" font-size="18" fill="#ff6b35" text-anchor="middle">⚡</text>
    <text x="70" y="47" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff">14 Skills Suite</text>
    <text x="22" y="88" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">End-to-end outbound pipeline:</text>
    <text x="22" y="110" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ff3366">• Research, Qualify, Contacts</text>
    <text x="22" y="130" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ff3366">• Outreach, Proposals &amp; Prep</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(330, 245)">
    <rect width="250" height="155" rx="16" fill="url(#card2)" stroke="#ff6b35" stroke-opacity="0.5" stroke-width="1.5" />
    <circle cx="38" cy="42" r="18" fill="#431407" stroke="#ff6b35" stroke-width="1.5" />
    <text x="38" y="48" font-family="system-ui, sans-serif" font-size="18" fill="#f59e0b" text-anchor="middle">🤖</text>
    <text x="70" y="47" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff">5 Parallel Agents</text>
    <text x="22" y="88" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Simultaneous audit execution:</text>
    <text x="22" y="110" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ff6b35">• Company, Contacts, Quality</text>
    <text x="22" y="130" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ff6b35">• Competition &amp; Strategy</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(610, 245)">
    <rect width="250" height="155" rx="16" fill="url(#card3)" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1.5" />
    <circle cx="38" cy="42" r="18" fill="#3b0764" stroke="#a855f7" stroke-width="1.5" />
    <text x="38" y="48" font-family="system-ui, sans-serif" font-size="18" fill="#c084fc" text-anchor="middle">📊</text>
    <text x="70" y="47" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff">BANT + MEDDIC</text>
    <text x="22" y="88" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Quantitative lead math:</text>
    <text x="22" y="110" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c084fc">• 0-100 Prospect Score</text>
    <text x="22" y="130" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c084fc">• Grades A+ to D &amp; Actions</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(890, 245)">
    <rect width="250" height="155" rx="16" fill="url(#card4)" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5" />
    <circle cx="38" cy="42" r="18" fill="#022c22" stroke="#10b981" stroke-width="1.5" />
    <text x="38" y="48" font-family="system-ui, sans-serif" font-size="18" fill="#34d399" text-anchor="middle">📄</text>
    <text x="70" y="47" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff">PDF Engine</text>
    <text x="22" y="88" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Vector PDF reporting:</text>
    <text x="22" y="110" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">• ReportLab bar charts &amp; gauges</text>
    <text x="22" y="130" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">• Publication-ready briefs</text>
  </g>
</svg>
