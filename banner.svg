<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" fill="none">
  <defs>
    <!-- Dark Cyber Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080c19;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d1527;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#070a14;stop-opacity:1" />
    </linearGradient>

    <!-- Vibrant Accents -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.06" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.02" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="340" fill="url(#bg)" rx="16" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="100" r="140" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />
  <circle cx="1000" cy="220" r="150" fill="#8b5cf6" opacity="0.14" filter="url(#glow)" />
  <circle cx="600" cy="170" r="120" fill="#3b82f6" opacity="0.10" filter="url(#glow)" />

  <!-- Tech Cyber Grid -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="340" />
    <line x1="300" y1="0" x2="300" y2="340" />
    <line x1="450" y1="0" x2="450" y2="340" />
    <line x1="600" y1="0" x2="600" y2="340" />
    <line x1="750" y1="0" x2="750" y2="340" />
    <line x1="900" y1="0" x2="900" y2="340" />
    <line x1="1050" y1="0" x2="1050" y2="340" />
  </g>

  <!-- Top Decorative Pill -->
  <rect x="475" y="40" width="250" height="28" rx="14" fill="url(#cardBg)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
  <text x="600" y="58" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="2">
    ⚡ AI OUTBOUND INTELLIGENCE ENGINE
  </text>

  <!-- Main Hero Title -->
  <text x="600" y="125" font-family="'Inter', system-ui, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">
    AI Sales Team
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="165" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">
    Autonomous Sales Intelligence &amp; Lead Scoring for <tspan fill="#38bdf8" font-weight="700">Claude Code</tspan>
  </text>

  <!-- Glowing Gradient Divider Bar -->
  <rect x="400" y="192" width="400" height="3" rx="1.5" fill="url(#accent)" />

  <!-- Feature Badge Cards (Glassmorphism Style) -->
  <!-- 14 Skills -->
  <rect x="180" y="235" width="180" height="48" rx="12" fill="url(#cardBg)" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1" />
  <text x="270" y="255" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700" fill="#22d3ee" text-anchor="middle">14 Modular Skills</text>
  <text x="270" y="272" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">Complete Sales Suite</text>

  <!-- 5 Parallel Agents -->
  <rect x="390" y="235" width="180" height="48" rx="12" fill="url(#cardBg)" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1" />
  <text x="480" y="255" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700" fill="#60a5fa" text-anchor="middle">5 Parallel Agents</text>
  <text x="480" y="272" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">Multi-Perspective Audit</text>

  <!-- BANT + MEDDIC -->
  <rect x="600" y="235" width="180" height="48" rx="12" fill="url(#cardBg)" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1" />
  <text x="690" y="255" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700" fill="#c084fc" text-anchor="middle">BANT + MEDDIC</text>
  <text x="690" y="272" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">Quantitative Lead Scoring</text>

  <!-- PDF Reports -->
  <rect x="810" y="235" width="180" height="48" rx="12" fill="url(#cardBg)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
  <text x="900" y="255" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700" fill="#34d399" text-anchor="middle">PDF Reports</text>
  <text x="900" y="272" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">ReportLab Chart Engine</text>

  <!-- Footer Credit -->
  <text x="600" y="318" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="500" fill="#475569" text-anchor="middle">
    Created by <tspan fill="#94a3b8" font-weight="600">Anvaya Arsha</tspan>
  </text>
</svg>
