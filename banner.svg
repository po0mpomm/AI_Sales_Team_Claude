<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="mainBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#030712;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#0b1329;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#050914;stop-opacity:1" />
    </linearGradient>

    <!-- Neon Header Gradient -->
    <linearGradient id="neonTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.02" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.02" />
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.02" />
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.02" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>
    <filter id="glowPurple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#mainBg)" rx="20" stroke="#1e293b" stroke-width="2" />

  <!-- Neon Ambient Glows -->
  <circle cx="150" cy="120" r="160" fill="#06b6d4" opacity="0.18" filter="url(#glowCyan)" />
  <circle cx="1050" cy="300" r="180" fill="#8b5cf6" opacity="0.18" filter="url(#glowPurple)" />
  <circle cx="600" cy="200" r="140" fill="#3b82f6" opacity="0.12" filter="url(#glowCyan)" />

  <!-- Cyber Mesh Lines -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
  </g>

  <!-- Header Badge Pill -->
  <g transform="translate(425, 32)">
    <rect width="350" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="20" cy="16" r="5" fill="#38bdf8" />
    <text x="35" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">CLAUDE CODE CLI EXTENSION</text>
  </g>

  <!-- Title Section -->
  <text x="600" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="58" font-weight="900" fill="url(#neonTitle)" text-anchor="middle" letter-spacing="-1">
    AI SALES TEAM
  </text>
  
  <text x="600" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">
    Autonomous Sales Intelligence, BANT/MEDDIC Lead Scoring &amp; PDF Reports
  </text>

  <!-- Author Badge Top Right -->
  <g transform="translate(980, 25)">
    <rect width="190" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="95" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">
      By <tspan fill="#38bdf8" font-weight="700">Anvaya Arsha</tspan>
    </text>
  </g>

  <!-- 4 Interactive Feature Cards Grid -->
  <!-- Card 1: 14 Modular Skills -->
  <g transform="translate(60, 210)">
    <rect width="250" height="150" rx="14" fill="url(#cardGrad1)" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="35" cy="40" r="16" fill="#082f49" stroke="#06b6d4" stroke-width="1.5" />
    <text x="35" y="45" font-family="system-ui, sans-serif" font-size="16" fill="#22d3ee" text-anchor="middle">⚡</text>
    <text x="65" y="45" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff">14 Skills Suite</text>
    <text x="20" y="80" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Full sales lifecycle support:</text>
    <text x="20" y="100" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#22d3ee">• Research, Qualify, Contacts</text>
    <text x="20" y="120" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#22d3ee">• Outreach, Proposals, Prep</text>
  </g>

  <!-- Card 2: 5 Parallel Subagents -->
  <g transform="translate(340, 210)">
    <rect width="250" height="150" rx="14" fill="url(#cardGrad2)" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="35" cy="40" r="16" fill="#172554" stroke="#3b82f6" stroke-width="1.5" />
    <text x="35" y="45" font-family="system-ui, sans-serif" font-size="16" fill="#60a5fa" text-anchor="middle">🤖</text>
    <text x="65" y="45" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff">5 Parallel Agents</text>
    <text x="20" y="80" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Simultaneous audit execution:</text>
    <text x="20" y="100" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#60a5fa">• Company, Contacts, Opportunity</text>
    <text x="20" y="120" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#60a5fa">• Competitive &amp; Strategy</text>
  </g>

  <!-- Card 3: BANT + MEDDIC Engine -->
  <g transform="translate(620, 210)">
    <rect width="250" height="150" rx="14" fill="url(#cardGrad3)" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="35" cy="40" r="16" fill="#2e1065" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="35" y="45" font-family="system-ui, sans-serif" font-size="16" fill="#c084fc" text-anchor="middle">📊</text>
    <text x="65" y="45" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff">BANT + MEDDIC</text>
    <text x="20" y="80" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Quantitative scoring math:</text>
    <text x="20" y="100" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#c084fc">• 0-100 Composite Prospect Score</text>
    <text x="20" y="120" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#c084fc">• Letter Grade &amp; Action Plan</text>
  </g>

  <!-- Card 4: Vector PDF Engine -->
  <g transform="translate(900, 210)">
    <rect width="250" height="150" rx="14" fill="url(#cardGrad4)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="35" cy="40" r="16" fill="#022c22" stroke="#10b981" stroke-width="1.5" />
    <text x="35" y="45" font-family="system-ui, sans-serif" font-size="16" fill="#34d399" text-anchor="middle">📑</text>
    <text x="65" y="45" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff">PDF Reports</text>
    <text x="20" y="80" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Vector graphics &amp; analytics:</text>
    <text x="20" y="100" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#34d399">• ReportLab bar charts &amp; gauges</text>
    <text x="20" y="120" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#34d399">• Multi-page executive briefs</text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="415" width="1200" height="5" fill="url(#neonTitle)" />
</svg>
